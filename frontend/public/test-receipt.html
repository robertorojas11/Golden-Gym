<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Generación de Recibo - Golden Gym</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #121212;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      color: #FA2F2A;
      font-size: 24px;
      margin-bottom: 5px;
    }
    p {
      color: #a0a0a0;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 25px;
    }
    button {
      background-color: #FA2F2A;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }
    button:hover {
      background-color: #d6201b;
    }
    .footer {
      margin-top: 30px;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GOLDEN GYM</h1>
    <p>Probador de Recibos PDF</p>
    
    <button onclick="generarReciboPrueba()">Generar y Descargar Recibo</button>
    
    <div class="footer">
      Este script utiliza jsPDF para generar un archivo PDF emulando el ticket físico de caja.
    </div>
  </div>

  <script>
    async function generarReciboPrueba() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: [80, 140]
      });

      const mockPayment = {
        referenceNumber: 'REF-8294719',
        paymentDate: new Date().toISOString(),
        amount: 45000, // $450.00 MXN in cents
        paymentMethodName: 'Tarjeta de Crédito',
        processedByName: 'Angie Garfias'
      };

      const mockMember = {
        firstName: 'Roberto',
        lastName: 'Rojas',
        memberNumber: 'GG-2026-0041'
      };

      const planName = 'Plan Mensual Estándar';

      // Brand Name (centered)
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(14);
      doc.setTextColor(250, 47, 42); // Golden Gym Brand Red
      doc.text('GOLDEN GYM', 40, 12, { align: 'center' });
      
      // Real location store info (centered)
      doc.setFont('Helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.setTextColor(80, 80, 80);
      doc.text('Madero 196, Centro, 76000', 40, 17, { align: 'center' });
      doc.text('Santiago de Querétaro, Qro.', 40, 21, { align: 'center' });
      doc.text('Tel: 446-117-7918', 40, 25, { align: 'center' });
      
      // Divider
      doc.setDrawColor(210, 210, 210);
      doc.setLineWidth(0.2);
      doc.line(8, 29, 72, 29);
      
      // Title
      doc.setFont('Helvetica', 'bold');
      doc.setFontSize(8.5);
      doc.setTextColor(40, 40, 40);
      doc.text('COMPROBANTE DE PAGO', 40, 34, { align: 'center' });
      
      // Receipt particulars
      doc.setFont('Helvetica', 'normal');
      doc.setFontSize(7.5);
      doc.text(`Folio Ref: ${mockPayment.referenceNumber}`, 8, 42);
      
      const dateObj = new Date(mockPayment.paymentDate);
      const paymentDateStr = dateObj.toLocaleString('es-MX', {
        dateStyle: 'short',
        timeStyle: 'short'
      });
      doc.text(`Fecha: ${paymentDateStr}`, 8, 47);
      
      // Client details
      doc.setFont('Helvetica', 'bold');
      doc.text('Socio:', 8, 55);
      doc.setFont('Helvetica', 'normal');
      doc.text(`${mockMember.firstName} ${mockMember.lastName}`, 8, 60);
      doc.text(`Folio Socio: ${mockMember.memberNumber}`, 8, 65);
      
      // Divider
      doc.line(8, 70, 72, 70);
      
      // Concept Details header
      doc.setFont('Helvetica', 'bold');
      doc.text('Concepto', 8, 75);
      doc.text('Total', 72, 75, { align: 'right' });
      
      // Concept Item details
      doc.setFont('Helvetica', 'normal');
      doc.text(planName, 8, 82);
      const amountVal = mockPayment.amount / 100;
      const amountStr = `$${amountVal.toFixed(2)} MXN`;
      doc.setFont('Helvetica', 'bold');
      doc.text(amountStr, 72, 82, { align: 'right' });
      
      // Divider
      doc.line(8, 88, 72, 88);
      
      // Payment Info
      doc.setFont('Helvetica', 'normal');
      doc.text(`Forma de Pago: ${mockPayment.paymentMethodName}`, 8, 94);
      doc.text('Estado de Transacción: APROBADO', 8, 99);
      doc.text(`Cajero: ${mockPayment.processedByName}`, 8, 104);
      
      // Footer
      doc.setDrawColor(210, 210, 210);
      doc.line(8, 110, 72, 110);
      
      doc.setFont('Helvetica', 'oblique');
      doc.setFontSize(7);
      doc.setTextColor(110, 110, 110);
      doc.text('¡Gracias por su preferencia!', 40, 116, { align: 'center' });
      
      doc.setFont('Helvetica', 'normal');
      doc.setFontSize(6.5);
      doc.text('Conserve este ticket para cualquier aclaración.', 40, 121, { align: 'center' });
      doc.text('Golden Gym - Fuerza y Disciplina', 40, 125, { align: 'center' });
      
      // Download Action
      doc.save(`Ticket_Prueba_${mockPayment.referenceNumber}.pdf`);
    }
  </script>
</body>
</html>
